[project]
name = "virtual-agent"
version = "0.1.0"
description = "A hand-written AI agent loop over a local open-source LLM"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
